name: Project 1 Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install curl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Run automated tests
        run: bash ./test_setup.sh
